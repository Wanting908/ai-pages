<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 赋能葡萄酒庄实战培训 · 宁夏贺兰山东麓产区</title>
<meta name="description" content="面向葡萄酒庄庄主与管理者的 AI 实战培训：AI 做机械活，核心思考自己做。用 AI 升级营销、品牌与经营效率。">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Songti SC", "STSong", "Microsoft YaHei", serif;
    background: #17100e;
    color: #e9ded2;
    min-height: 100vh;
    line-height: 1.7;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 24px 56px; }

  /* ===== 顶部 ===== */
  .hero {
    text-align: center;
    padding: 72px 0 40px;
    position: relative;
  }
  .hero::before {
    content: "";
    position: absolute;
    top: -60px; left: 50%;
    transform: translateX(-50%);
    width: 420px; height: 420px;
    background: radial-gradient(ellipse, rgba(127,212,193,0.14) 0%, transparent 70%);
    pointer-events: none;
  }
  .eyebrow {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 3px;
    color: #7fd4c1;
    text-transform: uppercase;
    padding: 6px 16px;
    border: 1px solid rgba(127,212,193,0.35);
    border-radius: 999px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    color: #f0e5d3;
    letter-spacing: 1px;
    line-height: 1.4;
  }
  h1 .gold { color: #d9b98a; }
  .sub {
    margin-top: 16px;
    font-size: 14px;
    color: #cbb8a5;
  }
  .divider {
    margin: 36px auto 0;
    width: 72px; height: 1px;
    background: linear-gradient(90deg, transparent, #d9b98a, transparent);
  }

  /* ===== 内容卡片 ===== */
  .card {
    background: linear-gradient(165deg, #241714 0%, #1d1210 100%);
    border: 1px solid rgba(217,185,138,0.16);
    border-radius: 16px;
    padding: 28px 24px;
    margin-top: 28px;
  }
  .card h2 {
    font-size: 18px;
    color: #e8cfae;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }
  .card h2::before {
    content: "";
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid #d9b98a;
    margin-right: 10px;
    vertical-align: -1px;
  }
  .card p { font-size: 14.5px; color: #cbb8a5; }
  .card ul { list-style: none; margin-top: 12px; }
  .card li {
    font-size: 14.5px;
    color: #cbb8a5;
    padding: 7px 0;
    padding-left: 22px;
    position: relative;
  }
  .card li::before {
    content: "";
    position: absolute;
    left: 4px; top: 15px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(127,212,193,0.75);
    box-shadow: 0 0 8px rgba(127,212,193,0.5);
  }

  /* ===== 按钮 ===== */
  .cta {
    margin-top: 36px;
    text-align: center;
  }
  .btn {
    display: inline-block;
    background: linear-gradient(135deg, #d9b98a 0%, #b98f52 100%);
    color: #17100e;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
    text-decoration: none;
    padding: 18px 52px;
    border-radius: 12px;
    box-shadow: 0 8px 28px rgba(217,185,138,0.22);
    min-height: 48px;
  }
  .btn-tip {
    margin-top: 14px;
    font-size: 13px;
    color: #8a7a68;
  }
  .btn-tip a { color: #7fd4c1; text-decoration: none; }

  /* ===== 页脚 ===== */
  .footer {
    margin-top: 56px;
    text-align: center;
    font-size: 12.5px;
    color: #6e6152;
    border-top: 1px solid rgba(217,185,138,0.14);
    padding-top: 24px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <span class="eyebrow">AI × 葡萄酒庄实战培训</span>
      <h1>AI 赋能葡萄酒庄<br><span class="gold">AI 做机械活，核心思考自己做</span></h1>
      <p class="sub">面向酒庄庄主与管理者的 AI 实战培训 · 宁夏贺兰山东麓产区</p>
      <div class="divider"></div>
    </div>

    <div class="card">
      <h2>这期培训，学什么</h2>
      <ul>
        <li>AI 帮您做营销：内容、文案、选题不再从零开始</li>
        <li>AI 帮您管成本：人力、库存、采购效率升级</li>
        <li>AI 帮您讲故事：品牌与庄主个人 IP 的放大</li>
        <li>不绑定任何单一平台，您的数据始终自主可控</li>
      </ul>
    </div>

    <div class="card">
      <h2>报名方式</h2>
      <p>先用 2 分钟填一份问卷，让我们了解您的需求与时间安排，后续按您的实际情况定制培训内容。</p>
    </div>

    <div class="cta">
      <a class="btn" href="/survey/">填写调研问卷</a>
      <p class="btn-tip">点击进入问卷（约 2 分钟）</p>
    </div>

    <div class="footer">
      AI 赋能葡萄酒庄实战培训 · 宁夏贺兰山东麓产区 2026
    </div>
  </div>
</body>
</html>
