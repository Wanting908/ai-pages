<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程评价调研</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            padding: 30px 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid #eee;
        }
        .section:last-child { border-bottom: none; }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 15px;
        }
        .question {
            margin-bottom: 20px;
        }
        .question-label {
            display: block;
            font-size: 15px;
            color: #444;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .question-label .num {
            color: #667eea;
            font-weight: 600;
        }
        .question-label .optional {
            color: #999;
            font-size: 12px;
            font-weight: 400;
        }
        .radio-group, .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .radio-group label, .checkbox-group label {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            color: #555;
        }
        .radio-group label:hover, .checkbox-group label:hover {
            background: #e8ecff;
        }
        .radio-group input:checked + span,
        .checkbox-group input:checked + span {
            color: #667eea;
            font-weight: 500;
        }
        .radio-group label:has(input:checked),
        .checkbox-group label:has(input:checked) {
            background: #e8ecff;
            border: 1px solid #667eea;
        }
        input[type="radio"], input[type="checkbox"] {
            margin-right: 10px;
            width: 16px;
            height: 16px;
            accent-color: #667eea;
        }
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .submit-btn:active {
            transform: translateY(0);
        }
        .thank-you {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        .thank-you h2 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .thank-you p {
            color: #666;
            font-size: 15px;
        }
        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 20px 15px; }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="form-section">
            <h1>课程评价调研</h1>
            <p class="subtitle">半天线下课程 + 两周线上陪跑 · 首次课程反馈</p>

            <form action="https://formsubmit.co/3279838738@qq.com" method="POST">
                <!-- FormSubmit配置 -->
                <input type="hidden" name="_subject" value="新的课程评价调研提交">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">

                <!-- 基本信息 -->
                <div class="section">
                    <div class="section-title">基本信息</div>

                    <div class="question">
                        <label class="question-label"><span class="num">1.</span> 您的姓名 <span class="optional">（选填）</span></label>
                        <input type="text" name="姓名" placeholder="选填，方便我们后续联系">
                    </div>

                    <div class="question">
                        <label class="question-label"><span class="num">2.</span> 您之前使用 AI 工具的经验如何？</label>
                        <div class="radio-group">
                            <label><input type="radio" name="AI经验" value="从未使用过"><span>从未使用过</span></label>
                            <label><input type="radio" name="AI经验" value="偶尔用过"><span>偶尔用过（如 ChatGPT 简单对话）</span></label>
                            <label><input type="radio" name="AI经验" value="经常使用"><span>经常使用，但主要是对话类</span></label>
                            <label><input type="radio" name="AI经验" value="已有一定经验"><span>已有一定经验，尝试过 Agent/自动化工具</span></label>
                        </div>
                    </div>
                </div>

                <!-- 线下课程部分 -->
                <div class="section">
                    <div class="section-title">线下课程部分</div>

                    <div class="question">
                        <label class="question-label"><span class="num">3.</span> 半天线下课程的整体时长安排您觉得如何？</label>
                        <div class="radio-group">
                            <label><input type="radio" name="线下时长" value="太短"><span>太短，很多内容没消化</span></label>
                            <label><input type="radio" name="线下时长" value="刚好"><span>刚好，节奏合适</span></label>
                            <label><input type="radio" name="线下时长" value="稍长"><span>稍长，信息量有点饱和</span></label>
                            <label><input type="radio" name="线下时长" value="太长"><span>太长，需要中场休息更多</span></label>
                        </div>
                    </div>

                    <div class="question">
                        <label class="question-label"><span class="num">4.</span> 线下课程中，您觉得最有价值的部分是？（可多选）</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="线下价值" value="AI工具介绍与演示"><span>AI 工具介绍与演示</span></label>
                            <label><input type="checkbox" name="线下价值" value="实操环节"><span>实操环节（动手搭建系统）</span></label>
                            <label><input type="checkbox" name="线下价值" value="案例讲解"><span>案例讲解</span></label>
                            <label><input type="checkbox" name="线下价值" value="互动答疑"><span>互动答疑</span></label>
                            <label><input type="checkbox" name="线下价值" value="其他"><span>其他（请在下方说明）</span></label>
                        </div>
                        <input type="text" name="线下价值_其他" placeholder="如选其他，请补充" style="margin-top: 8px;">
                    </div>

                    <div class="question">
                        <label class="question-label"><span class="num">5.</span> 线下课程的节奏是否合适？</label>
                        <div class="radio-group">
                            <label><input type="radio" name="线下节奏" value="太快"><span>节奏太快，跟不上</span></label>
                            <label><input type="radio" name="线下节奏" value="稍快"><span>稍快，但能勉强跟上</span></label>
                            <label><input type="radio" name="线下节奏" value="刚好"><span>刚好</span></label>
                            <label><input type="radio" name="线下节奏" value="稍慢"><span>稍慢，可以增加更多实操</span></label>
                            <label><input type="radio" name="线下节奏" value="太慢"><span>太慢，内容可以更紧凑</span></label>
                        </div>
                    </div>
                </div>

                <!-- 线上陪跑部分 -->
                <div class="section">
                    <div class="section-title">线上陪跑部分</div>

                    <div class="question">
                        <label class="question-label"><span class="num">6.</span> 两周线上陪跑的频率和时长安排您觉得如何？</label>
                        <div class="radio-group">
                            <label><input type="radio" name="陪跑频率" value="频率太低"><span>频率太低，希望更频繁</span></label>
                            <label><input type="radio" name="陪跑频率" value="频率合适"><span>频率合适</span></label>
                            <label><input type="radio" name="陪跑频率" value="频率太高"><span>频率太高，消化不了</span></label>
                            <label><input type="radio" name="陪跑频率" value="时长不合适"><span>每次时长不合适（请说明）</span></label>
                        </div>
                    </div>

                    <div class="question">
                        <label class="question-label"><span class="num">7.</span> 线上陪跑中，哪些形式对您帮助最大？（可多选）</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="陪跑形式" value="一对一答疑"><span>一对一答疑</span></label>
                            <label><input type="checkbox" name="陪跑形式" value="群内讨论"><span>群内讨论交流</span></label>
                            <label><input type="checkbox" name="陪跑形式" value="每日任务"><span>每日任务/作业驱动</span></label>
                            <label><input type="checkbox" name="陪跑形式" value="文档模板"><span>文档/模板参考</span></label>
                            <label><input type="checkbox" name="陪跑形式" value="其他"><span>其他（请在下方说明）</span></label>
                        </div>
                        <input type="text" name="陪跑形式_其他" placeholder="如选其他，请补充" style="margin-top: 8px;">
                    </div>

                    <div class="question">
                        <label class="question-label"><span class="num">8.</span> 您觉得两周的陪跑周期是否足够？</label>
                        <div class="radio-group">
                            <label><input type="radio" name="陪跑周期" value="太短"><span>太短，还没完全掌握</span></label>
                            <label><input type="radio" name="陪跑周期" value="刚好"><span>刚好，基本能独立运用了</span></label>
                            <label><input type="radio" name="陪跑周期" value="稍长"><span>稍长，前期内容消化后后期互动减少</span></label>
                            <label><input type="radio" name="陪跑周期" value="太长"><span>太长，后期动力下降</span></label>
                        </div>
                    </div>
                </div>

                <!-- 内容深度与实用性 -->
                <div class="section">
                    <div class="section-title">内容深度与实用性</div>

                    <div class="question">
                        <label class="question-label"><span class="num">9.</span> 课程内容整体难度您觉得如何？</label>
                        <div class="radio-group">
                            <label><input type="radio" name="难度" value="太基础"><span>太基础，缺乏深度</span></label>
                            <label><input type="radio" name="难度" value="稍简单"><span>稍简单，可以更有挑战</span></label>
                            <label><input type="radio" name="难度" value="适中"><span>适中，有收获</span></label>
                            <label><input type="radio" name="难度" value="偏难"><span>偏难，部分内容消化不了</span></label>
                            <label><input type="radio" name="难度" value="太难"><span>太难，跟不上</span></label>
                        </div>
                    </div>

                    <div class="question">
                        <label class="question-label"><span class="num">10.</span> 课程中学到的内容，您实际落地应用了多少？</label>
                        <div class="radio-group">
                            <label><input type="radio" name="落地情况" value="几乎没有"><span>几乎没有落地</span></label>
                            <label><input type="radio" name="落地情况" value="1-2个"><span>落地了 1-2 个工具/场景</span></label>
                            <label><input type="radio" name="落地情况" value="3-5个"><span>落地了 3-5 个</span></label>
                            <label><input type="radio" name="落地情况" value="大部分"><span>大部分都已应用</span></label>
                        </div>
                    </div>

                    <div class="question">
                        <label class="question-label"><span class="num">11.</span> 您觉得最有用的 1-2 个具体工具或方法是？</label>
                        <textarea name="最有用内容" placeholder="请简要描述"></textarea>
                    </div>

                    <div class="question">
                        <label class="question-label"><span class="num">12.</span> 有没有哪些内容您觉得可以精简或去掉？</label>
                        <textarea name="可精简内容" placeholder="请简要描述"></textarea>
                    </div>
                </div>

                <!-- 形式与改进建议 -->
                <div class="section">
                    <div class="section-title">形式与改进建议</div>

                    <div class="question">
                        <label class="question-label"><span class="num">13.</span> 对于"半天线下 + 两周线上陪跑"这种形式，您的整体评价是？</label>
                        <div class="radio-group">
                            <label><input type="radio" name="形式评价" value="非常好"><span>非常好，建议保持</span></label>
                            <label><input type="radio" name="形式评价" value="比较好"><span>比较好，但需要调整</span></label>
                            <label><input type="radio" name="形式评价" value="一般"><span>一般，可以考虑其他形式</span></label>
                            <label><input type="radio" name="形式评价" value="不太理想"><span>不太理想</span></label>
                        </div>
                    </div>

                    <div class="question">
                        <label class="question-label"><span class="num">14.</span> 如果继续开课，您更倾向于哪种形式？</label>
                        <div class="radio-group">
                            <label><input type="radio" name="期望形式" value="纯线下"><span>纯线下集中培训（1-2天）</span></label>
                            <label><input type="radio" name="期望形式" value="纯线上"><span>纯线上（视频课+社群陪跑）</span></label>
                            <label><input type="radio" name="期望形式" value="线上自学+线下答疑"><span>线上自学 + 线下集中答疑</span></label>
                            <label><input type="radio" name="期望形式" value="线下小班+长期陪跑"><span>线下小班实操 + 长期线上陪跑（按月付费）</span></label>
                            <label><input type="radio" name="期望形式" value="其他"><span>其他建议（请在下方说明）</span></label>
                        </div>
                        <input type="text" name="期望形式_其他" placeholder="如选其他，请补充" style="margin-top: 8px;">
                    </div>

                    <div class="question">
                        <label class="question-label"><span class="num">15.</span> 对于课程内容，您希望未来增加哪些方向？（可多选）</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="未来方向" value="行业案例"><span>更多行业应用场景案例</span></label>
                            <label><input type="checkbox" name="未来方向" value="进阶Agent"><span>进阶 Agent 搭建</span></label>
                            <label><input type="checkbox" name="未来方向" value="自动化工作流"><span>自动化工作流设计</span></label>
                            <label><input type="checkbox" name="未来方向" value="策略规划"><span>AI 与业务结合的策略规划</span></label>
                            <label><input type="checkbox" name="未来方向" value="其他"><span>其他（请在下方说明）</span></label>
                        </div>
                        <input type="text" name="未来方向_其他" placeholder="如选其他，请补充" style="margin-top: 8px;">
                    </div>

                    <div class="question">
                        <label class="question-label"><span class="num">16.</span> 您对本次课程的其他建议或想说的话？</label>
                        <textarea name="其他建议" placeholder="欢迎畅所欲言"></textarea>
                    </div>
                </div>

                <button type="submit" class="submit-btn">提交问卷</button>
            </form>
        </div>

        <div class="thank-you" id="thank-you">
            <h2>感谢您的反馈！</h2>
            <p>您的意见对我们非常重要，我们会认真听取每一份建议。</p>
        </div>
    </div>

    <script>
        // FormSubmit提交后显示感谢页面
        document.querySelector('form').addEventListener('submit', function(e) {
            // 让表单正常提交到FormSubmit，然后在当前页面显示感谢
            e.preventDefault();
            
            const formData = new FormData(this);
            
            fetch(this.action, {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    document.getElementById('form-section').style.display = 'none';
                    document.getElementById('thank-you').style.display = 'block';
                } else {
                    alert('提交失败，请稍后重试或直接联系老师。');
                }
            }).catch(error => {
                alert('网络错误，请稍后重试。');
            });
        });
    </script>
</body>
</html>
